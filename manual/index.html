<script>
var NODOS=[].slice.call(document.getElementById('tpl').content.children), SL=NODOS.map(function(d){return d.innerHTML;}), IDS=NODOS.map(function(d){return d.getAttribute('data-id');}), N=SL.length, idx=0;
function leerHash(){ var hs=decodeURIComponent((location.hash||'').slice(1)); if(!hs) return; if(/^\d+$/.test(hs)) idx=Math.min(N-1,Math.max(0,+hs-1)); else { var k=IDS.indexOf(hs); if(k>=0) idx=k; } }

function escalarEn(fr){var s=fr.querySelector('.sl'); if(s) s.style.transform='scale('+(fr.clientWidth/1920)+')';}
function alto(){ document.documentElement.style.setProperty('--hh', document.getElementById('hd').offsetHeight+'px'); }
function pintar(){
  var cont=document.getElementById('pres'), fr=document.getElementById('presFr');
  var W=cont.clientWidth-20, H=cont.clientHeight-12, k=Math.min(W/1920,H/1080);
  fr.style.width=Math.round(1920*k)+'px'; fr.style.height=Math.round(1080*k)+'px';
  fr.innerHTML=SL[idx]; escalarEn(fr);
  document.getElementById('cnt').textContent=(idx+1)+' / '+N;
  document.getElementById('bAnt').disabled=idx===0; document.getElementById('bSig').disabled=idx===N-1;
  try{ history.replaceState(null,'','#'+(idx+1)); }catch(e){}
}
function ir(d){ idx=Math.min(N-1,Math.max(0,idx+d)); pintar(); }
function modo(m){
  document.body.classList.toggle('todas', m==='todas');
  document.getElementById('bPres').classList.toggle('on', m==='pres'); document.getElementById('bTodas').classList.toggle('on', m==='todas');
  if(m==='todas'){ var t=document.getElementById('todas'); if(!t.children.length){ t.innerHTML=SL.map(function(s,i){return '<div class="fr" onclick="idx='+i+';modo(\'pres\')">'+s+'</div>';}).join(''); } t.querySelectorAll('.fr').forEach(escalarEn); window.scrollTo(0,0); }
  else { alto(); pintar(); }
}
function pantallaCompleta(){ var e=document.documentElement; if(document.fullscreenElement||document.webkitFullscreenElement){(document.exitFullscreen||document.webkitExitFullscreen).call(document);return;} var f=e.requestFullscreen||e.webkitRequestFullscreen; if(f) f.call(e); else alert('Este navegador no permite pantalla completa. En el celular, girálo para verlo más grande.'); }
document.addEventListener('keydown',function(e){ if(document.body.classList.contains('todas')) return; if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){e.preventDefault();ir(1);} if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();ir(-1);} });
var x0=null, pres=document.getElementById('pres');
pres.addEventListener('touchstart',function(e){x0=e.touches[0].clientX;},{passive:true});
pres.addEventListener('touchend',function(e){ if(x0===null) return; var dx=e.changedTouches[0].clientX-x0; if(Math.abs(dx)>40) ir(dx<0?1:-1); x0=null; });
